basePath: /api/v1
definitions:
  handler.categoryWriteRequest:
    properties:
      description:
        type: string
      name:
        maxLength: 60
        minLength: 2
        type: string
      pillar:
        type: string
    required:
    - name
    type: object
  handler.createCommentRequest:
    properties:
      content:
        type: string
    required:
    - content
    type: object
  handler.forgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  handler.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  handler.logoutRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  handler.postCreateRequest:
    properties:
      category_id:
        type: string
      content:
        type: string
      title:
        maxLength: 200
        minLength: 5
        type: string
    required:
    - category_id
    - content
    - title
    type: object
  handler.postStatusRequest:
    properties:
      is_hidden:
        type: boolean
      status:
        $ref: '#/definitions/model.ContentStatus'
    required:
    - status
    type: object
  handler.postUpdateRequest:
    properties:
      category_id:
        type: string
      content:
        type: string
      title:
        maxLength: 200
        minLength: 5
        type: string
    type: object
  handler.refreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  handler.registerRequest:
    properties:
      captcha_token:
        type: string
      email:
        type: string
      password:
        minLength: 8
        type: string
      username:
        maxLength: 30
        minLength: 3
        type: string
    required:
    - captcha_token
    - email
    - password
    - username
    type: object
  handler.resetPasswordRequest:
    properties:
      new_password:
        minLength: 8
        type: string
      token:
        type: string
    required:
    - new_password
    - token
    type: object
  handler.setPasswordRequest:
    properties:
      new_password:
        minLength: 8
        type: string
    required:
    - new_password
    type: object
  handler.setRoleRequest:
    properties:
      role:
        $ref: '#/definitions/model.UserRole'
    required:
    - role
    type: object
  handler.updateMeRequest:
    properties:
      avatar_url:
        type: string
      banner_url:
        type: string
      bio:
        type: string
      username:
        type: string
    type: object
  handler.voteRequest:
    properties:
      value:
        type: integer
    required:
    - value
    type: object
  model.Category:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      pillar:
        description: '"dev" | "ai"'
        type: string
      slug:
        type: string
    type: object
  model.Comment:
    properties:
      author:
        $ref: '#/definitions/model.User'
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_hidden:
        type: boolean
      post_id:
        type: string
      status:
        $ref: '#/definitions/model.ContentStatus'
      updated_at:
        type: string
      user_id:
        type: string
      user_vote:
        type: integer
      vote_count:
        description: Champs calculés (non stockés en DB)
        type: integer
    type: object
  model.ContentStatus:
    enum:
    - pending_moderation
    - approved
    - flagged
    - blocked
    type: string
    x-enum-varnames:
    - StatusPendingModeration
    - StatusApproved
    - StatusFlagged
    - StatusBlocked
  model.Post:
    properties:
      author:
        allOf:
        - $ref: '#/definitions/model.User'
        description: Relations
      category:
        $ref: '#/definitions/model.Category'
      category_id:
        type: string
      comment_count:
        type: integer
      content:
        description: TipTap HTML
        type: string
      created_at:
        type: string
      id:
        type: string
      images:
        items:
          $ref: '#/definitions/model.PostImage'
        type: array
      is_hidden:
        type: boolean
      status:
        $ref: '#/definitions/model.ContentStatus'
      title:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
      user_vote:
        type: integer
      vote_count:
        description: Champs calculés (non stockés en DB)
        type: integer
    type: object
  model.PostImage:
    properties:
      created_at:
        type: string
      id:
        type: string
      mime_type:
        type: string
      post_id:
        type: string
      size_bytes:
        type: integer
      url:
        type: string
    type: object
  model.User:
    properties:
      avatar_url:
        type: string
      banner_url:
        type: string
      bio:
        type: string
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      id:
        type: string
      role:
        $ref: '#/definitions/model.UserRole'
      updated_at:
        type: string
      username:
        type: string
    type: object
  model.UserRole:
    enum:
    - user
    - moderator
    - admin
    type: string
    x-enum-varnames:
    - RoleUser
    - RoleModerator
    - RoleAdmin
  service.PostListResult:
    properties:
      data:
        items:
          $ref: '#/definitions/model.Post'
        type: array
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
    type: object
  service.PublicProfile:
    properties:
      follower_count:
        type: integer
      following_count:
        type: integer
      is_following:
        type: boolean
      post_count:
        type: integer
      recent_posts:
        items:
          $ref: '#/definitions/model.Post'
        type: array
      user:
        $ref: '#/definitions/model.User'
    type: object
  service.UserListResult:
    properties:
      data:
        items:
          $ref: '#/definitions/model.User'
        type: array
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
    type: object
  service.VoteResult:
    properties:
      user_vote:
        description: +1, -1 ou null
        type: integer
      vote_count:
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    name: DevHelp Team
    url: https://github.com/bloiss/DevHelp
  description: API REST du forum DevHelp — entraide Dev & IA.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: DevHelp API
  version: "1.0"
paths:
  /api/v1/admin/posts:
    get:
      description: Retourne tous les posts toutes statuts confondus, avec filtre optionnel.
        Accessible aux admins et modérateurs.
      parameters:
      - description: Filtrer par statut (published, pending, rejected, hidden)
        in: query
        name: status
        type: string
      - description: Page
        in: query
        name: page
        type: integer
      - description: Par page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.PostListResult'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lister tous les posts avec filtre de statut (admin)
      tags:
      - admin
  /api/v1/admin/posts/{id}/status:
    patch:
      consumes:
      - application/json
      description: Modifie le statut de modération d'un post (published, pending,
        rejected, hidden). Réservé aux admins et modérateurs.
      parameters:
      - description: UUID post
        in: path
        name: id
        required: true
        type: string
      - description: Nouveau statut
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.postStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Post'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Changer le statut d'un post (admin/modo)
      tags:
      - admin
  /api/v1/admin/users:
    get:
      description: Retourne la liste paginée de tous les utilisateurs. Accessible
        aux admins et modérateurs.
      parameters:
      - description: Page
        in: query
        name: page
        type: integer
      - description: Par page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.UserListResult'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lister tous les utilisateurs (admin)
      tags:
      - admin
  /api/v1/admin/users/{id}/role:
    patch:
      consumes:
      - application/json
      description: Modifie le rôle d'un utilisateur (user, moderator, admin). Réservé
        aux administrateurs.
      parameters:
      - description: UUID utilisateur
        in: path
        name: id
        required: true
        type: string
      - description: Nouveau rôle
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.setRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Changer le rôle d'un utilisateur (admin)
      tags:
      - admin
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Envoie un email de réinitialisation si l'adresse existe. Retourne
        toujours 200 pour ne pas révéler les comptes existants.
      parameters:
      - description: Email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.forgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Demande de réinitialisation de mot de passe
      tags:
      - auth
  /api/v1/auth/github:
    get:
      description: Génère un state CSRF et redirige l'utilisateur vers la page d'authentification
        GitHub.
      produces:
      - application/json
      responses:
        "307":
          description: Redirect to GitHub
          schema:
            type: string
      summary: Redirection vers GitHub OAuth
      tags:
      - auth
  /api/v1/auth/github/callback:
    get:
      description: Reçoit le code d'autorisation GitHub, échange les tokens, crée
        ou connecte l'utilisateur et redirige vers le frontend avec les tokens JWT.
      parameters:
      - description: State CSRF
        in: query
        name: state
        required: true
        type: string
      - description: Code d'autorisation
        in: query
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "307":
          description: Redirect to /auth/login?error=oauth_failed
          schema:
            type: string
      summary: Callback GitHub OAuth
      tags:
      - auth
  /api/v1/auth/google:
    get:
      description: Génère un state CSRF et redirige l'utilisateur vers la page d'authentification
        Google.
      produces:
      - application/json
      responses:
        "307":
          description: Redirect to Google
          schema:
            type: string
      summary: Redirection vers Google OAuth
      tags:
      - auth
  /api/v1/auth/google/callback:
    get:
      description: Reçoit le code d'autorisation Google, échange les tokens, crée
        ou connecte l'utilisateur et redirige vers le frontend avec les tokens JWT.
      parameters:
      - description: State CSRF
        in: query
        name: state
        required: true
        type: string
      - description: Code d'autorisation
        in: query
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "307":
          description: Redirect to /auth/login?error=oauth_failed
          schema:
            type: string
      summary: Callback Google OAuth
      tags:
      - auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authentifie un utilisateur et retourne les tokens JWT d'accès et
        de rafraîchissement.
      parameters:
      - description: Identifiants
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Connexion par email/mot de passe
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Révoque le refresh token fourni pour invalider la session courante.
      parameters:
      - description: Refresh token à révoquer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.logoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Déconnexion (révocation du refresh token)
      tags:
      - auth
  /api/v1/auth/me:
    get:
      description: Retourne les informations du compte de l'utilisateur authentifié
        via le token JWT.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Profil de l'utilisateur connecté
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Échange un refresh token valide contre de nouveaux tokens d'accès
        et de rafraîchissement.
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Renouveler les tokens
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Crée un nouveau compte utilisateur avec email, username et mot
        de passe. Retourne les tokens d'accès et de rafraîchissement.
      parameters:
      - description: Données d'inscription
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Inscription par email/mot de passe
      tags:
      - auth
  /api/v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Réinitialise le mot de passe en utilisant le token reçu par email.
      parameters:
      - description: Token + nouveau mot de passe
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.resetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Réinitialisation du mot de passe
      tags:
      - auth
  /api/v1/auth/set-password:
    post:
      consumes:
      - application/json
      description: Permet à un utilisateur inscrit via OAuth de définir un mot de
        passe pour activer la connexion classique.
      parameters:
      - description: Nouveau mot de passe
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.setPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Définir un mot de passe après inscription OAuth
      tags:
      - auth
  /api/v1/categories:
    get:
      description: Retourne la liste complète des catégories disponibles.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Category'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Lister toutes les catégories
      tags:
      - categories
    post:
      consumes:
      - application/json
      description: Crée une nouvelle catégorie. Réservé aux administrateurs.
      parameters:
      - description: Données
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.categoryWriteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Category'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Créer une catégorie (admin)
      tags:
      - categories
  /api/v1/categories/{id}:
    delete:
      description: Supprime une catégorie. Réservé aux administrateurs.
      parameters:
      - description: UUID catégorie
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Supprimer une catégorie (admin)
      tags:
      - categories
    put:
      consumes:
      - application/json
      description: Met à jour les informations d'une catégorie existante. Réservé
        aux administrateurs.
      parameters:
      - description: UUID catégorie
        in: path
        name: id
        required: true
        type: string
      - description: Données
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.categoryWriteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Category'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Modifier une catégorie (admin)
      tags:
      - categories
  /api/v1/categories/{slug}:
    get:
      description: Retourne les détails d'une catégorie identifiée par son slug.
      parameters:
      - description: Slug de la catégorie
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Category'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Récupérer une catégorie par son slug
      tags:
      - categories
  /api/v1/conversations:
    get:
      description: Retourne toutes les conversations de l'utilisateur connecté, triées
        par activité récente.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lister les conversations
      tags:
      - messages
    post:
      consumes:
      - application/json
      description: Ouvre une conversation existante ou en crée une nouvelle avec un
        autre utilisateur. Retourne la conversation.
      parameters:
      - description: 'user_id: UUID de l''interlocuteur'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Ouvrir ou créer une conversation
      tags:
      - messages
